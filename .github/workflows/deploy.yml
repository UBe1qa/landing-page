name: Deploy

# main 브랜치에 올릴 때마다, 그리고 매일 오전 6시(한국 시간)에 GitHub Pages로 다시 배포합니다.
# 매일 배포할 때 네이버 블로그 새 글을 받아 랜딩페이지의 '센터 소식'에 반영합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html og.png apple-touch-icon.png _site/
      # 블로그를 읽지 못해도 배포는 계속하고, 페이지는 블로그 바로가기만 보여 줍니다.
      - name: Fetch latest blog posts
        run: node scripts/fetch-blog.mjs _site
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
